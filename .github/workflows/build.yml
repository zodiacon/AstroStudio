# Builds the solution (Debug and Release, x64) and runs AstroCore.Tests on every push and pull request.
#
# The projects use toolset v145 (Visual Studio 2026), which the windows-2025 image has. Catch2 comes from the runner's own
# vcpkg (classic mode, like on a developer's machine), installed for the x64-windows-static triplet that the test project links
# against; the built packages are cached between runs.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Restore the vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-catch2-x64-windows-static-${{ runner.os }}-v1

      - name: Install Catch2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}\vcpkg-cache" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install catch2:x64-windows-static
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # makes $(VcpkgRoot) and the vcpkg MSBuild integration known to every project
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          exit $LASTEXITCODE

      - name: Build
        run: msbuild AstroStudio.sln -p:Configuration=${{ matrix.configuration }} -p:Platform=x64 -m -v:m

      - name: Test
        run: x64\${{ matrix.configuration }}\AstroCore.Tests.exe --reporter console --reporter JUnit::out=test-results.xml

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: test-results.xml
          if-no-files-found: ignore

      - name: Keep the program
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: AstroStudio-x64
          path: x64\Release\AstroStudio.exe
          retention-days: 14
